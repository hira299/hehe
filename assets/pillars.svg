<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" role="img" aria-label="AI automation &amp; agents · LLM pipelines &amp; RAG · Backend &amp; cloud · QA &amp; reliability"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E9E6EC}.muted{fill:#8F93A3}.pink{fill:#E6B8CB}.rose{fill:#D69DB5}.hi{fill:#9C5B78}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.kt{font-size:17px;font-weight:700}.kd{font-size:13px}</style><rect width="880" height="214" fill="#0E1015"/><g class="up" style="animation-delay:0.00s"><rect x="0.5" y=".5" width="208.5" height="213" rx="16" fill="#14161D" stroke="#272A35"/><g class="float" style="animation-delay:0.0s"><g transform="translate(20.0 20) scale(0.9)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 34 L18 14 L30 34 L42 14" stroke="#272A35" stroke-width="1.6"/><circle cx="6" cy="34" r="4.5" stroke="#E9E6EC" stroke-width="1.6" fill="#14161D"/><circle cx="18" cy="14" r="4.5" stroke="#E9E6EC" stroke-width="1.6" fill="#14161D"/><circle cx="30" cy="34" r="4.5" stroke="#E9E6EC" stroke-width="1.6" fill="#14161D"/><circle cx="42" cy="14" r="4.5" stroke="#E9E6EC" stroke-width="1.6" fill="#14161D"/><circle r="3" fill="#E6B8CB" stroke="none"><animateMotion dur="3s" repeatCount="indefinite" path="M6 34 L18 14 L30 34 L42 14"/></circle></g></g><text x="20.0" y="104" class="sans kt fg">AI automation</text><text x