<svg xmlns="http://www.w3.org/2000/svg" width="880" height="60" viewBox="0 0 880 60" role="img" aria-label="05 Independent builds"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#EFE7E9}.muted{fill:#9B9094}.pink{fill:#F4B8C8}.rose{fill:#E98AA5}.hi{fill:#C1304A}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.n{font-size:13px;letter-spacing:.1em}.t{font-size:24px;font-weight:700;letter-spacing:-.01em}</style><rect width="880" height="60" fill="#0D1117"/><text x="0" y="38" class="mono n hi">05</text><text x="52" y="40" class="sans t fg">Independent builds</text><line x1="310" y1="32" x2="880" y2="32" stroke="#2D2328" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.2s" fill="freeze"/></line><line x1="310" y1="32" x2="880" y2="32" stroke="#F4B8C8" stroke-width="2" stroke-linecap="round" pathLength="1" stroke-dasharray=".05 .95"><animate attributeName="stroke-dashoffset" from="0.05" to="-1" dur="5s" repeatCount="indefinite"/></line></svg>
