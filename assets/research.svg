<svg xmlns="http://www.w3.org/2000/svg" width="880" height="252" viewBox="0 0 880 252" role="img" aria-label="CloudFix-Bench results: 83.81% vs 64.76% vs 35.24%"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E9E6EC}.muted{fill:#8F93A3}.pink{fill:#E6B8CB}.rose{fill:#D69DB5}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.float{animation:none}}.bt{font-size:17px;font-weight:700}.bl{font-size:14.5px}.bv{font-size:16px;font-weight:700}.bn{font-size:12px}</style><defs></defs><rect width="880" height="252" fill="#0D1117"/><text x="2" y="26" class="sans bt fg">CloudFix-Bench: remediation rate on 105 AWS Terraform cases</text><text x="2" y="62" class="sans bl muted">Sentinel-Mesh (LLM + Z3 counterexample feedback)</text><text x="810" y="62" text-anchor="end" class="sans bv fg">83.81%</text><text x="878" y="62" text-anchor="end" class="mono bn muted">88/105</text><rect x="2" y="74" width="876" height="10" rx="5" fill="#151A23"/><rect x="2" y="74" width="0" height="10" rx="5" fill="#E6B8CB"><animate attributeName="width" from="0" to="734" begin="0.30s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect><text x="2" y="116" class="sans bl muted">Same LLM, no counterexample feedback</text><text x="810" y="116" text-anchor="end" class="sans bv fg">64.76%</text><text x="878" y="116" text-anchor="end" class="mono bn muted">68/105</text><rect x="2" y="128" width="876" height="10" rx="5" fill="#151A23"/><rect x="2" y="128" width="0" height="10" rx="5" fill="#9C5B78"><animate attributeName="width" from="0" to="567" begin="0.55s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect><text x="2" y="170" class="sans bl muted">Checkov baseline</text><text x="810" y="170" text-anchor="end" class="sans bv fg">35.24%</text><text x="878" y="170" text-anchor="end" class="mono bn muted">37/105</text><rect x="2" y="182" width="876" height="10" rx="5" fill="#151A23"/><rect x="2" y="182" width="0" height="10" rx="5" fill="#4A2B3C"><animate attributeName="width" from="0" to="309" begin="0.80s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect><text x="2" y="238" class="sans bn muted">95% Wilson interval 75.59% to 89.64%. Guarantees hold within the modeled Cloud Perimeter Model.</text></svg>
