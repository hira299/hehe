<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-label="CloudFix-Bench results: 83.81% vs 64.76% vs 35.24%"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E9E6EC}.muted{fill:#8F93A3}.pink{fill:#E6B8CB}.rose{fill:#D69DB5}.hi{fill:#9C5B78}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.bt{font-size:17px;font-weight:700}.bl{font-size:14px}.bv{font-size:15px;font-weight:700}.bn{font-size:12px}</style><rect width="880" height="236" fill="#0E1015"/><rect x=".5" y=".5" width="879" height="235" rx="16" fill="#14161D" stroke="#272A35"/><text x="24" y="38" class="sans bt fg">CloudFix-Bench: remediation rate on 105 AWS Terraform cases</text><text x="24" y="84" class="sans bl muted">Sentinel-Mesh (LLM + Z3 counterexample feedback)</text><rect x="380" y="70" width="340" height="20" rx="10" fill="#0E1015" stroke="#272A35"/><rect x="380" y="70" width="0" height="20" rx="10" fill="#E6B8CB"><animate attributeName="width" from="0" to="285" begin="0.30s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect><text x="734" y="85" class="sans bv fg">83.81%</text><text x="804" y="85" class="mono bn muted">88/105</text><text x="24" y="130" class="sans bl muted">Same LLM, no counterexample feedback</text><rect x="380" y="116" width="340" height="20" rx="10" fill="#0E1015" stroke="#272A35"/><rect x="380" y="116" width="0" height="20" rx="10" fill="#9C5B78"><animate attributeName="width" from="0" to="220" begin="0.55s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect><text x="734" y="131" class="sans bv fg">64.76%</text><text x="804" y="131" class="mono bn muted">68/105</text><text x="24" y="176" class="sans bl muted">Checkov baseline</text><rect x="380" y="162" width="340" height="20" rx="10" fill="#0E1015" stroke="#272A35"/><rect x="380" y="162" width="0" height="20" rx="10" fill="#4A2B3C"><animate attributeName="width" from="0" to="120" begin="0.80s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect><text x="734" y="177" class="sans bv fg">35.24%</text><text x="804" y="177" class="mono bn muted">37/105</text><text x="24" y="216" class="sans bn muted">95% Wilson interval 75.59% to 89.64%. Guarantees hold within the modeled Cloud Perimeter Model.</text></svg>
