<svg xmlns="http://www.w3.org/2000/svg" width="432" height="278" viewBox="0 0 432 278" role="img" aria-label="Cloud Compliance Engine. 3 AWS services audited. Autonomous multi-account audit across S3, IAM and GuardDuty, grounded with Corrective RAG."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#EFE7E9}.muted{fill:#9B9094}.pink{fill:#F4B8C8}.rose{fill:#E98AA5}.hi{fill:#C1304A}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.tag{font-size:11px;letter-spacing:.08em}.title{font-size:19px;font-weight:700}.met{font-size:44px;font-weight:700;letter-spacing:-.02em}.ml{font-size:13px}.desc{font-size:13.5px}.more{font-size:12.5px;font-weight:600}</style><rect width="432" height="278" fill="#0D1117"/><rect x=".5" y=".5" width="431" height="277" rx="16" fill="#151116" stroke="#2D2328"/><rect x=".5" y=".5" width="431" height="277" rx="16" fill="none" stroke="#F4B8C8" stroke-width="1.5" pathLength="1" stroke-dasharray="0.12 0.88"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="7s" repeatCount="indefinite"/></rect><g class="float"><g transform="translate(24 20) scale(1.0)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 36 H35 A8 8 0 0 0 36 20 A12 12 0 0 0 14 21 A7.5 7.5 0 0 0 14 36 Z" stroke="#EFE7E9" stroke-width="1.6"/><line x1="12" x2="38" y1="14" y2="14" stroke="#F4B8C8" stroke-width="2"><animate attributeName="y1" values="14;40;14" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y2" values="14;40;14" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3.4s" repeatCount="indefinite"/></line></g></g><rect x="253" y="24" width="155" height="24" rx="12" fill="none" stroke="#8E1F30"/><text x="330" y="40" text-anchor="middle" class="sans tag muted">INDEPENDENT BUILD</text><text x="24" y="100" class="sans title fg">Cloud Compliance Engine</text><text x="24" y="148" class="sans met pink">3</text><text x="24" y="170" class="sans ml muted">AWS services audited</text><text x="24" y="198" class="sans desc muted">Autonomous multi-account audit across S3, IAM and</text><text x="24" y="218" class="sans desc muted">GuardDuty, grounded with Corrective RAG.</text><circle cx="30" cy="254" r="3.5" class="pink pulse"/><text x="408" y="258" text-anchor="end" class="sans more pink">Case study →<animate attributeName="x" values="408;412;408" dur="1.8s" repeatCount="indefinite"/></text></svg>
