<svg xmlns="http://www.w3.org/2000/svg" width="432" height="278" viewBox="0 0 432 278" role="img" aria-label="AI Enrichment Pipeline. 28K+ live records processed. Four status-gated LLM stages with 9-language translation. Zero schema drift in production."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#EFE7E9}.muted{fill:#9B9094}.pink{fill:#F4B8C8}.rose{fill:#E98AA5}.hi{fill:#C1304A}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.tag{font-size:11px;letter-spacing:.08em}.title{font-size:19px;font-weight:700}.met{font-size:44px;font-weight:700;letter-spacing:-.02em}.ml{font-size:13px}.desc{font-size:13.5px}.more{font-size:12.5px;font-weight:600}</style><rect width="432" height="278" fill="#0D1117"/><rect x=".5" y=".5" width="431" height="277" rx="16" fill="#151116" stroke="#2D2328"/><rect x=".5" y=".5" width="431" height="277" rx="16" fill="none" stroke="#F4B8C8" stroke-width="1.5" pathLength="1" stroke-dasharray="0.12 0.88"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="7s" repeatCount="indefinite"/></rect><g class="float"><g transform="translate(24 20) scale(1.0)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 34 L18 14 L30 34 L42 14" stroke="#2D2328" stroke-width="1.6"/><circle cx="6" cy="34" r="4.5" stroke="#EFE7E9" stroke-width="1.6" fill="#151116"/><circle cx="18" cy="14" r="4.5" stroke="#EFE7E9" stroke-width="1.6" fill="#151116"/><circle cx="30" cy="34" r="4.5" stroke="#EFE7E9" stroke-width="1.6" fill="#151116"/><circle cx="42" cy="14" r="4.5" stroke="#EFE7E9" stroke-width="1.6" fill="#151116"/><circle r="3" fill="#F4B8C8" stroke="none"><animateMotion dur="3s" repeatCount="indefinite" path="M6 34 L18 14 L30 34 L42 14"/></circle></g></g><rect x="253" y="24" width="155" height="24" rx="12" fill="none" stroke="#8E1F30"/><text x="330" y="40" text-anchor="middle" class="sans tag muted">PRODUCTION SYSTEM</text><text x="24" y="100" class="sans title fg">AI Enrichment Pipeline</text><text x="24" y="148" class="sans met pink">28K+</text><text x="24" y="170" class="sans ml muted">live records processed</text><text x="24" y="198" class="sans desc muted">Four status-gated LLM stages with 9-language</text><text x="24" y="218" class="sans desc muted">translation. Zero schema drift in production.</text><circle cx="30" cy="254" r="3.5" class="pink pulse"/><text x="408" y="258" text-anchor="end" class="sans more pink">Case study →<animate attributeName="x" values="408;412;408" dur="1.8s" repeatCount="indefinite"/></text></svg>
