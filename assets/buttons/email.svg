<svg xmlns="http://www.w3.org/2000/svg" width="148" height="44" viewBox="0 0 148 44" role="img" aria-label="Email"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E9E6EC}.muted{fill:#8F93A3}.pink{fill:#E6B8CB}.rose{fill:#D69DB5}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.float{animation:none}}.b{font-size:14.5px;font-weight:600}</style><defs></defs><rect width="148" height="44" fill="#0D1117"/><rect width="148" height="44" rx="22" fill="#151A23"/><circle cx="24" cy="22.0" r="3.5" fill="#D69DB5"/><text x="82" y="27.5" text-anchor="middle" class="sans b fg">Email</text></svg>
