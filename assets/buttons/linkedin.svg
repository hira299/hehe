<svg xmlns="http://www.w3.org/2000/svg" width="150" height="46" viewBox="0 0 150 46" role="img" aria-label="LinkedIn"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E9E6EC}.muted{fill:#8F93A3}.pink{fill:#E6B8CB}.rose{fill:#D69DB5}.hi{fill:#9C5B78}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.b{font-size:14.5px;font-weight:600}</style><rect width="150" height="46" fill="#0E1015"/><rect x="1" y="1" width="148" height="44" rx="23" fill="#14161D" stroke="#4A2B3C" stroke-width="1.3"/><text x="65" y="28.5" text-anchor="middle" class="sans b fg">LinkedIn</text><text x="114" y="28.5" class="sans b pink">→<animate attributeName="x" values="112;118;112" dur="1.8s" repeatCount="indefinite"/></text></svg>
