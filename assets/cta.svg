<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Need resilient AI pipelines or high-assurance QA? hira229922@gmail.com"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#EFE7E9}.muted{fill:#9B9094}.pink{fill:#F4B8C8}.rose{fill:#E98AA5}.hi{fill:#C1304A}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.big{font-size:30px;font-weight:700;letter-spacing:-.02em}.sub{font-size:16px}</style><rect width="880" height="200" fill="#0D1117"/><rect x=".5" y=".5" width="879" height="199" rx="20" fill="#151116" stroke="#2D2328"/><rect x=".5" y=".5" width="879" height="199" rx="20" fill="none" stroke="#F4B8C8" stroke-width="1.5" pathLength="1" stroke-dasharray="0.2 0.8"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="8s" repeatCount="indefinite"/></rect><text x="440" y="82" text-anchor="middle" class="sans big fg up">Need resilient AI pipelines or high-assurance QA?</text><text x="440" y="116" text-anchor="middle" class="sans sub muted up" style="animation-delay:.25s">n8n workflows, LLM extraction, multi-tenant B2B SaaS testing. Remote.</text><g class="up" style="animation-delay:.5s"><circle cx="340" cy="154" r="4.5" class="pink pulse"/><text x="352" y="158.5" class="mono" fill="#F4B8C8" style="font-size:14px">hira229922@gmail.com</text></g></svg>
