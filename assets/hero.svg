<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-label="Hira Ahmed. AI Engineer and Systems QA Lead."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E9E6EC}.muted{fill:#8F93A3}.pink{fill:#E6B8CB}.rose{fill:#D69DB5}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.float{animation:none}}.name{font-size:64px;font-weight:700;letter-spacing:-.025em}.role{font-size:24px;font-weight:600}.line{font-size:18px}.meta{font-size:13px}.status{font-size:12px;letter-spacing:.1em}.gate{font-size:11px;letter-spacing:.1em}@keyframes r{0%{opacity:0;transform:translateY(8px)}5%{opacity:1;transform:none}28%{opacity:1;transform:none}33%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}.r0{opacity:0;animation:r 12s ease-in-out 0.8s infinite}.r1{opacity:0;animation:r 12s ease-in-out 4.8s infinite}.r2{opacity:0;animation:r 12s ease-in-out 8.8s infinite}</style><defs></defs><rect width="880" height="290" fill="#0D1117"/><path d="M770 40 C870 80 640 128 745 172 S872 236 752 262" fill="none" stroke="#2A2E3B" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8"/><circle cx="770.0" cy="40.0" r="6.5" fill="#0D1117" stroke="#D69DB5" stroke-width="1.6"/><text x="750.0" y="44.0" text-anchor="end" class="mono gate muted">QUEUED</text><circle cx="726.6" cy="127.6" r="6.5" fill="#0D1117" stroke="#D69DB5" stroke-width="1.6"/><text x="706.6" y="131.6" text-anchor="end" class="mono gate muted">ENRICHED</text><circle cx="821.0" cy="209.7" r="6.5" fill="#0D1117" stroke="#D69DB5" stroke-width="1.6"/><text x="801.0" y="213.7" text-anchor="end" class="mono gate muted">TRANSLATED</text><circle cx="752.0" cy="262.0" r="6.5" fill="#0D1117" stroke="#D69DB5" stroke-width="1.6"/><text x="732.0" y="266.0" text-anchor="end" class="mono gate muted">VERIFIED</text><circle r="13" fill="#E6B8CB" opacity=".16"><animateMotion dur="7s" repeatCount="indefinite" path="M770 40 C870 80 640 128 745 172 S872 236 752 262"/></circle><circle r="5" fill="#E6B8CB"><animateMotion dur="7s" repeatCount="indefinite" path="M770 40 C870 80 640 128 745 172 S872 236 752 262"/></circle><g class="up" style="animation-delay:.1s"><circle cx="12" cy="40" r="3.5" fill="#D69DB5"/><text x="26" y="44" class="sans status muted">AVAILABLE FOR ENGAGEMENTS</text></g><text x="4" y="124" class="sans name fg up" style="animation-delay:.3s">Hira Ahmed<tspan class="pink">.</tspan></text><text x="8" y="166" class="sans role pink up" style="animation-delay:.55s">AI Engineer &amp; Systems QA Lead</text><text x="8" y="222" class="sans line fg r0">Autonomous LLM pipelines that keep working.</text><text x="8" y="222" class="sans line fg r1">1,500+ defects documented. 0 schema drift.</text><text x="8" y="222" class="sans line fg r2">The model proposes. The verifier decides.</text><text x="8" y="256" class="sans meta muted up" style="animation-delay:.9s">Karachi, Pakistan  ·  Remote  ·  overlaps US, Canada, UK, Ireland and Germany hours</text></svg>
