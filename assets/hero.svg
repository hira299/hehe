<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Hira Ahmed. AI Engineer and Systems QA Lead."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E9E6EC}.muted{fill:#8F93A3}.pink{fill:#E6B8CB}.rose{fill:#D69DB5}.hi{fill:#9C5B78}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.name{font-size:54px;font-weight:700;letter-spacing:-.02em}.lead{font-size:22px;font-weight:600}.pill{font-size:12px;letter-spacing:.08em}.typed{font-size:15px}.gate{font-size:11px;letter-spacing:.08em}@keyframes gate{0%,3%{stroke:#272A35}6%,16%{stroke:#E6B8CB}24%,100%{stroke:#272A35}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes t0{0%{width:0}15.00%{width:387px}30.67%{width:387px}33.33%{width:0}100%{width:0}}@keyframes k0{0%{transform:translateX(0);opacity:1}15.00%{transform:translateX(387px);opacity:1}30.67%{transform:translateX(387px);opacity:1}33.33%{transform:translateX(0);opacity:1}33.34%{opacity:0}100%{opacity:0}}.c0{width:0px;animation:t0 12.0s steps(43,end) 1.2s infinite}.k0{opacity:0;animation:k0 12.0s steps(43,end) 1.2s infinite}@keyframes t1{0%{width:0}15.00%{width:378px}30.67%{width:378px}33.33%{width:0}100%{width:0}}@keyframes k1{0%{transform:translateX(0);opacity:1}15.00%{transform:translateX(378px);opacity:1}30.67%{transform:translateX(378px);opacity:1}33.33%{transform:translateX(0);opacity:1}33.34%{opacity:0}100%{opacity:0}}.c1{width:0px;animation:t1 12.0s steps(42,end) 5.2s infinite}.k1{opacity:0;animation:k1 12.0s steps(42,end) 5.2s infinite}@keyframes t2{0%{width:0}15.00%{width:369px}30.67%{width:369px}33.33%{width:0}100%{width:0}}@keyframes k2{0%{transform:translateX(0);opacity:1}15.00%{transform:translateX(369px);opacity:1}30.67%{transform:translateX(369px);opacity:1}33.33%{transform:translateX(0);opacity:1}33.34%{opacity:0}100%{opacity:0}}.c2{width:0px;animation:t2 12.0s steps(41,end) 9.2s infinite}.k2{opacity:0;animation:k2 12.0s steps(41,end) 9.2s infinite}</style><rect width="880" height="300" fill="#0E1015"/><rect x=".5" y=".5" width="879" height="299" rx="20" fill="#14161D" stroke="#272A35"/><line x1="745" y1="63" x2="745" y2="243" stroke="#272A35" stroke-width="2" stroke-dasharray="3 5"/><rect x="660" y="44" width="170" height="38" rx="10" fill="#14161D" stroke="#272A35" stroke-width="1.5" style="animation:gate 6s linear -0.4s infinite"/><circle cx="680" cy="63" r="4" fill="#9C5B78"/><text x="696" y="67" class="mono gate muted">QUEUED</text><rect x="660" y="104" width="170" height="38" rx="10" fill="#14161D" stroke="#272A35" stroke-width="1.5" style="animation:gate 6s linear 1.6s infinite"/><circle cx="680" cy="123" r="4" fill="#9C5B78"/><text x="696" y="127" class="mono gate muted">ENRICHED</text><rect x="660" y="164" width="170" height="38" rx="10" fill="#14161D" stroke="#272A35" stroke-width="1.5" style="animation:gate 6s linear 3.6s infinite"/><circle cx="680" cy="183" r="4" fill="#9C5B78"/><text x="696" y="187" class="mono gate muted">TRANSLATED</text><rect x="660" y="224" width="170" height="38" rx="10" fill="#14161D" stroke="#272A35" stroke-width="1.5" style="animation:gate 6s linear 5.6s infinite"/><circle cx="680" cy="243" r="4" fill="#E6B8CB"/><text x="696" y="247" class="mono gate muted">VERIFIED</text><circle r="5" fill="#E6B8CB"><animateMotion dur="6s" repeatCount="indefinite" path="M745 63 V243" calcMode="linear"/></circle><circle r="11" fill="none" s