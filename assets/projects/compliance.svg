<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148" role="img" aria-label="Cloud Compliance Engine. 60+ automated security checks. Autonomous multi-account AWS audit: 60+ checks across services, mapped to the official AWS benchmark."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E9E6EC}.muted{fill:#8F93A3}.pink{fill:#E6B8CB}.rose{fill:#D69DB5}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.float{animation:none}}.tag{font-size:11px;letter-spacing:.1em}.title{font-size:22px;font-weight:700}.desc{font-size:14px}.met{font-size:46px;font-weight:700;letter-spacing:-.02em}.ml{font-size:13px}.go{font-size:14px;font-weight:600}</style><defs></defs><rect width="880" height="148" fill="#0D1117"/><path d="M60 0 C60 37.0 100 44.4 100 74.0 S60 111.0 60 148.0" fill="none" stroke="#2A2E3B" stroke-width="2.2" stroke-linecap="round"/><circle r="5" fill="#E6B8CB" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M60 0 C60 37.0 100 44.4 100 74.0 S60 111.0 60 148.0" calcMode="linear" keyPoints="0;0;0;1;1;1" keyTimes="0;0.250;0.252;0.498;0.500;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.250;0.252;0.498;0.500;1"/></circle><circle cx="100" cy="74.0" r="7.5" fill="#0D1117" stroke="#D69DB5" stroke-width="2"/><rect x="136" y="10" width="742" height="128" rx="30" fill="#151A23" fill-opacity=".75"/><g class="up" style="animation-delay:0.12s"><text x="168" y="50" class="mono tag muted">INDEPENDENT BUILD</text><text x="1